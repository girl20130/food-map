<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔚華科技 周邊美食地圖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#242424; --border:#2e2e2e;
    --accent:#ff6b35; --accent2:#ffd166; --accent3:#06d6a0;
    --text:#f0ede8; --text2:#9e9a94; --text3:#5a5650;
    --tag-tw:#ff6b35; --tag-jp:#e84393; --tag-in:#ff9500;
    --tag-cafe:#7c6fcd; --tag-west:#00b4d8; --tag-hot:#ef233c;
    --tag-veg:#06d6a0; --tag-snack:#ffd166; --tag-other:#6c757d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

  /* HEADER */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:16px;height:64px;}
  .logo{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.08em;white-space:nowrap;}
  .logo span{color:var(--text2);}
  .header-title{font-size:16px;font-weight:700;}
  .header-sub{font-size:12px;color:var(--text2);margin-top:1px;}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .count-badge{background:var(--accent);color:white;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:'Space Mono',monospace;}

  .sync-status{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
  .sync-dot.ok{background:var(--accent3);box-shadow:0 0 6px var(--accent3);}
  .sync-dot.err{background:var(--tag-hot);}
  .sync-dot.loading{background:var(--accent2);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .add-btn{background:var(--accent3);color:#0f0f0f;font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;display:flex;align-items:center;gap:5px;transition:opacity .15s;}
  .add-btn:hover{opacity:.85;}
  .add-btn:disabled{opacity:.4;cursor:not-allowed;}

  .refresh-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
  .refresh-btn:hover{border-color:var(--accent2);color:var(--accent2);}

  /* SEARCH */
  .search-wrap{padding:16px 24px 0;}
  .search-box{position:relative;max-width:500px;}
  .search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 16px 10px 42px;color:var(--text);font-size:14px;font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s;}
  .search-box input:focus{border-color:var(--accent);}
  .search-box input::placeholder{color:var(--text3);}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;}

  /* FILTERS */
  .filter-bar{padding:14px 24px 0;display:flex;gap:8px;flex-wrap:wrap;}
  .filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;font-family:'Noto Sans TC',sans-serif;}
  .filter-btn:hover{border-color:var(--accent);color:var(--text);}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:white;}
  .filter-dot{width:7px;height:7px;border-radius:50%;}

  .area-bar{padding:12px 24px 0;display:flex;gap:6px;flex-wrap:wrap;}
  .area-btn{background:transparent;border:1px solid var(--border);color:var(--text3);padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
  .area-btn:hover{border-color:var(--accent2);color:var(--accent2);}
  .area-btn.active{background:var(--surface2);border-color:var(--accent2);color:var(--accent2);}

  /* MAIN */
  .main{display:grid;grid-template-columns:1fr;height:calc(100vh - 64px - 56px - 50px - 44px - 36px);min-height:400px;}

  .card-list{overflow-y:auto;padding:16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start;}
  .card-list::-webkit-scrollbar{width:4px;}
  .card-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

  /* LOADING STATE */
  .loading-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);gap:12px;}
  .spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;min-height:110px;}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:var(--accent);opacity:0;transition:opacity .15s;}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .card:hover::before{opacity:1;}
  .card.highlighted{border-color:var(--accent);background:#1f1a17;}
  .card.highlighted::before{opacity:1;}
  .card.user-card{border-color:#1a2e20;}
  .card.user-card::after{content:'👤 新增';position:absolute;bottom:10px;right:10px;font-size:9px;color:var(--accent3);font-weight:700;background:#0d201a;padding:2px 6px;border-radius:4px;border:1px solid var(--accent3)44;}

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .card-name{font-size:15px;font-weight:700;line-height:1.3;}
  .card-rating{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--accent2);white-space:nowrap;background:var(--surface2);padding:2px 8px;border-radius:6px;}
  .card-rating::before{content:'★ ';}
  .card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;}
  .area-badge{font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
  .card-note{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;padding:8px 12px;background:var(--surface2);border-radius:6px;}
  .card-meta{display:flex;gap:12px;font-size:11px;color:var(--text3);flex-wrap:wrap;margin-top:4px;padding-top:8px;border-top:1px solid var(--border);}

  /* REVIEW */
  .review-item{background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .review-author{font-size:11px;font-weight:700;color:var(--accent2);margin-bottom:4px;}
  .review-text{font-size:12px;color:var(--text2);line-height:1.5;}
  .review-stars{color:var(--accent2);font-size:11px;margin-left:6px;}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;}
  .photo-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
  .section-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;}
  .add-review-btn{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;width:100%;margin-bottom:8px;}
  .add-review-btn:hover{border-color:var(--accent);color:var(--text);}

  /* REVIEW MODAL */
  .review-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .review-modal.open{opacity:1;pointer-events:all;}
  .review-modal-box{background:var(--surface);border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:600px;transform:translateY(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);}
  .review-modal.open .review-modal-box{transform:translateY(0);}
  .star-row{display:flex;gap:8px;margin:12px 0;}
  .star-btn{font-size:28px;cursor:pointer;opacity:.3;transition:opacity .15s;}
  .star-btn.active{opacity:1;}

  .card-del{position:absolute;bottom:10px;right:10px;background:transparent;border:1px solid var(--border);color:var(--text3);font-size:10px;padding:2px 7px;border-radius:4px;cursor:pointer;display:none;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
  .user-card:hover .card-del{display:block;}
  .card-del:hover{background:var(--tag-hot);border-color:var(--tag-hot);color:white;}

  /* MAP PANEL */
  .map-panel{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
  .map-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  .map-header h3{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
  .map-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3);font-size:13px;text-align:center;padding:20px;}
  .map-placeholder .icon{font-size:40px;}

  /* DETAIL - 改成全螢幕 Modal */
  .detail-panel{
    position:fixed;inset:0;
    background:var(--surface);
    border-top:none;
    padding:0;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.16,1,.3,1);
    z-index:150;
    display:flex;
    flex-direction:column;
    max-height:100vh;
    overflow:hidden;
  }
  .detail-panel.open{transform:translateY(0);}

  .detail-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:20px 24px 14px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex-shrink:0;
  }
  .detail-name{font-size:18px;font-weight:900;margin-bottom:4px;}
  .detail-rating{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent2);}
  .detail-body{
    flex:1;overflow-y:auto;
    padding:16px 24px 24px;
    font-size:13px;color:var(--text2);line-height:1.8;
  }
  .detail-close{
    background:var(--surface2);border:1px solid var(--border);color:var(--text2);
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px;
  }
  .detail-map{
    width:100%;height:260px;border-radius:10px;overflow:hidden;
    border:1px solid var(--border);margin:12px 0;
  }
  .detail-map iframe{width:100%;height:100%;border:0;display:block;}
  .detail-open-map{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent);color:white;
    padding:10px 18px;border-radius:8px;
    font-size:13px;font-weight:700;text-decoration:none;
    margin-top:4px;
  }

  @media(max-width:600px){
    .detail-header{padding:16px 16px 12px;}
    .detail-body{padding:12px 16px 20px;}
    .detail-name{font-size:16px;}
    .detail-map{height:220px;}
  }

  /* STATUS */
  .status-bar{padding:8px 24px;border-top:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--text3);display:flex;gap:16px;align-items:center;}
  .status-count{color:var(--accent);font-weight:700;font-family:'Space Mono',monospace;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:520px;transform:translateY(20px);transition:transform .25s cubic-bezier(.16,1,.3,1);max-height:90vh;overflow-y:auto;}
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal h2{font-size:18px;font-weight:900;margin-bottom:4px;}
  .modal-sub{font-size:12px;color:var(--text2);margin-bottom:20px;}

  .form-row{margin-bottom:14px;}
  .form-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;display:block;letter-spacing:.05em;}
  .form-label span{color:var(--accent);}
  .form-input,.form-select,.form-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
  .form-input::placeholder,.form-textarea::placeholder{color:var(--text3);}
  .form-select option{background:var(--surface2);}
  .form-textarea{resize:vertical;min-height:70px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .cat-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .cat-check{display:none;}
  .cat-label{font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--border);color:var(--text2);transition:all .15s;user-select:none;}
  .cat-check:checked + .cat-label{background:var(--accent);border-color:var(--accent);color:white;}

  .modal-footer{display:flex;gap:10px;margin-top:20px;}
  .btn-cancel{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;}
  .btn-cancel:hover{border-color:var(--text2);color:var(--text);}
  .btn-submit{flex:2;background:var(--accent);border:none;color:white;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:opacity .15s;}
  .btn-submit:hover{opacity:.85;}
  .btn-submit:disabled{opacity:.5;cursor:not-allowed;}

  /* TOAST */
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;z-index:300;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{border-color:var(--accent3);color:var(--accent3);}
  .toast.error{border-color:var(--tag-hot);color:var(--tag-hot);}

  /* SETUP BANNER */
  .setup-banner{background:#1a1200;border:1px solid var(--accent2)44;border-radius:10px;padding:12px 16px;margin:12px 24px 0;font-size:12px;color:var(--accent2);display:flex;align-items:flex-start;gap:10px;line-height:1.6;}
  .setup-banner .icon{font-size:18px;flex-shrink:0;margin-top:1px;}
  .setup-banner a{color:var(--accent);text-decoration:underline;}
  .setup-banner .close-banner{margin-left:auto;cursor:pointer;color:var(--text3);font-size:14px;flex-shrink:0;}

  .no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3);}
  .no-results .icon{font-size:40px;margin-bottom:10px;}

  @media(max-width:900px){
    .main{grid-template-columns:1fr;height:auto;min-height:0;}
    .map-panel{display:none;}
    .detail-panel{right:0;}
  }

  /* ── 手機版優化 ── */
  @media(max-width:600px){
    /* Header 縮小 */
    header{height:auto;padding:10px 14px;flex-wrap:wrap;gap:8px;}
    .logo{font-size:11px;}
    .header-title{font-size:14px;}
    .header-sub{display:none;}
    .header-right{gap:6px;}
    .sync-status{font-size:10px;}
    .add-btn{font-size:11px;padding:6px 10px;}
    .count-badge{font-size:10px;padding:2px 8px;}
    .refresh-btn{font-size:11px;padding:5px 8px;}

    /* 搜尋列 */
    .search-wrap{padding:10px 12px 0;}
    .search-box input{font-size:13px;padding:9px 12px 9px 36px;}
    .search-icon{font-size:14px;left:12px;}

    /* 篩選按鈕 — 橫向捲動，不換行 */
    .filter-bar{
      padding:10px 12px 0;
      flex-wrap:nowrap;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      gap:6px;
    }
    .filter-bar::-webkit-scrollbar{display:none;}
    .filter-btn{
      flex-shrink:0;
      font-size:11px;
      padding:5px 10px;
      white-space:nowrap;
    }

    /* 區域按鈕 — 橫向捲動 */
    .area-bar{
      padding:8px 12px 0;
      flex-wrap:nowrap;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      gap:5px;
    }
    .area-bar::-webkit-scrollbar{display:none;}
    .area-btn{
      flex-shrink:0;
      font-size:10px;
      padding:4px 10px;
      white-space:nowrap;
    }

    /* 卡片清單 */
    .card-list{
      padding:10px 12px;
      grid-template-columns:1fr;
      gap:8px;
      height:calc(100vh - 120px);
      overflow-y:auto;
    }

    /* 卡片 */
    .card{padding:12px 14px;}
    .card-name{font-size:13px;}
    .card-note{font-size:11px;}
    .card.user-card::after{font-size:8px;top:8px;right:8px;}

    /* 狀態列 */
    .status-bar{
      padding:6px 12px;
      font-size:10px;
      gap:8px;
      flex-wrap:wrap;
    }

    /* 詳情面板 */
    .detail-panel{padding:14px 16px;gap:12px;}
    .detail-name{font-size:15px;}
    .detail-rating{font-size:12px;}
    .detail-body{font-size:11px;}

    /* 新增 Modal */
    .modal{padding:20px 16px;}
    .modal h2{font-size:16px;}
    .form-grid{grid-template-columns:1fr;}
    .form-input,.form-select,.form-textarea{font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">SPIROX <span>/ 蔚華科技</span></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:2px;">
      <div class="header-title">周邊美食地圖</div>
    </div>
  </div>
  <div class="header-right">
    <div class="sync-status" id="sync-status">
      <div class="sync-dot loading" id="sync-dot"></div>
      <span id="sync-text">連線中…</span>
    </div>
    <button class="refresh-btn" onclick="loadData()" title="重新整理">↺ 同步</button>
    <button class="add-btn" id="add-btn" onclick="openModal()">＋ 新增店家</button>
    <div class="count-badge" id="total-count">載入中</div>
  </div>
</header>

<!-- SETUP BANNER（未設定 API 時顯示） -->
<div class="setup-banner" id="setup-banner" style="display:none;">
  <div class="icon">⚙️</div>
  <div>
    <strong>尚未設定 Google 試算表 API</strong><br>
    請照步驟設定後，把 API 網址貼到這個 HTML 的 <code style="background:#ffffff11;padding:1px 5px;border-radius:3px;">APPS_SCRIPT_URL</code> 變數。
    目前顯示的是<strong>預設資料</strong>，新增的店家只存在你的瀏覽器。
    <br><a href="#" onclick="document.getElementById('setup-banner').style.display='none'">了解了，暫時關閉</a>
  </div>
  <span class="close-banner" onclick="document.getElementById('setup-banner').style.display='none'">✕</span>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="搜尋店名、菜色、關鍵字…">
  </div>
</div>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-filter="all">🍽️ 全部</button>
  <button class="filter-btn" data-filter="台式"><span class="filter-dot" style="background:var(--tag-tw)"></span>台式</button>
  <button class="filter-btn" data-filter="日式"><span class="filter-dot" style="background:var(--tag-jp)"></span>日式</button>
  <button class="filter-btn" data-filter="印度"><span class="filter-dot" style="background:var(--tag-in)"></span>印度</button>
  <button class="filter-btn" data-filter="咖啡"><span class="filter-dot" style="background:var(--tag-cafe)"></span>咖啡廳</button>
  <button class="filter-btn" data-filter="西式"><span class="filter-dot" style="background:var(--tag-west)"></span>西式</button>
  <button class="filter-btn" data-filter="麻辣"><span class="filter-dot" style="background:var(--tag-hot)"></span>麻辣/串串</button>

// ── STATE ──────────────────────────────────────────────────
let allData = [];
let activeFilter = 'all';
let activeArea = 'all';
let searchText = '';
let isApiMode = false;

const TAG_COLORS = {
  '台式':'var(--tag-tw)','日式':'var(--tag-jp)','印度':'var(--tag-in)',
  '咖啡':'var(--tag-cafe)','西式':'var(--tag-west)','麻辣':'var(--tag-hot)',
  '素食':'var(--tag-veg)','小吃':'var(--tag-snack)'
};

function getAreaLabel(a) {
  return {'水源街':'🏢 公司周邊','公道五路':'🛣️ 公道五路','馬偕':'🏥 馬偕周邊'}[a] || a;
}

// ── SYNC STATUS ────────────────────────────────────────────
function setSyncStatus(state, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  dot.className = 'sync-dot ' + state;
  txt.textContent = text;
}

// ── LOAD DATA ──────────────────────────────────────────────
async function loadData() {
  setSyncStatus('loading', '同步中…');

  if (!APPS_SCRIPT_URL) {
    // No API — use default + localStorage
    document.getElementById('setup-banner').style.display = 'flex';
    const local = JSON.parse(localStorage.getItem('weihua_local') || '[]');
    allData = [...DEFAULT_DATA, ...local];
    isApiMode = false;
    setSyncStatus('', '本地模式');
    document.getElementById('last-sync').textContent = '使用預設資料（未設定 API）';
    renderCards();
    return;
  }

  try {
    const res = await fetch(APPS_SCRIPT_URL, { cache: 'no-store' });
    const json = await res.json();
    if (json.ok) {
      allData = json.data;
      isApiMode = true;
      setSyncStatus('ok', '已同步');
      const now = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('last-sync').textContent = `上次同步：${now}`;
      renderCards();
    } else {
      throw new Error(json.error);
    }
  } catch(e) {
    setSyncStatus('err', '連線失敗');
    document.getElementById('last-sync').textContent = '同步失敗，顯示預設資料';
    const local = JSON.parse(localStorage.getItem('weihua_local') || '[]');
    allData = [...DEFAULT_DATA, ...local];
    renderCards();
    console.error('API error:', e);
  }
}

// ── RENDER ─────────────────────────────────────────────────
function renderCards() {
  const list = document.getElementById('card-list');
  list.innerHTML = '';
  let count = 0;
  const userCount = allData.filter(r => r.user).length;

  allData.forEach((r, i) => {
    const catMatch = activeFilter === 'all' || (r.cat && r.cat.includes(activeFilter));
    const areaMatch = activeArea === 'all' || r.area === activeArea;
    const q = searchText.toLowerCase();
    const searchMatch = !q || r.name.toLowerCase().includes(q) || (r.note||'').toLowerCase().includes(q) || (r.cat||[]).some(c=>c.includes(q));
    if (!catMatch || !areaMatch || !searchMatch) return;

    count++;
    const card = document.createElement('div');
    card.className = 'card' + (r.user ? ' user-card' : '');

    card.innerHTML = `
      <div class="card-top">
        <div class="card-name">${r.name}</div>
        ${r.rating ? `<div class="card-rating">${parseFloat(r.rating).toFixed(1)}</div>` : ''}
      </div>
      <div class="card-tags">
        ${(r.cat||[]).map(c=>`<span class="tag" style="background:${TAG_COLORS[c]||'var(--tag-other)'}22;color:${TAG_COLORS[c]||'var(--tag-other)'};border:1px solid ${TAG_COLORS[c]||'var(--tag-other)'}44">${c}</span>`).join('')}
        <span class="area-badge">${getAreaLabel(r.area)}</span>
      </div>
      ${r.note ? `<div class="card-note">💬 ${r.note}</div>` : ''}
      <div class="card-meta">
        ${r.hours ? `<span>🕐 ${r.hours}</span>` : ''}
        ${r.closed ? `<span style="color:var(--tag-hot)">✕ ${r.closed}公休</span>` : '<span style="color:var(--accent3)">✓ 天天開</span>'}
        ${(()=>{ const w=calcWalkingTime(r.name, r.addr, r.lat, r.lng); return w ? `<span style="color:${w.color};font-weight:600;">${w.emoji} 約${w.mins}分鐘</span>` : ''; })()}
      </div>
      ${r.user ? `<button class="card-del" onclick="deleteEntry(event,${i})">🗑 刪除</button>` : ''}
    `;
    card.addEventListener('click', e => { if(e.target.classList.contains('card-del')) return; showDetail(r, card); });
    list.appendChild(card);
  });

  if (count === 0) {
    list.innerHTML = `<div class="no-results"><div class="icon">🍽️</div><div>找不到符合條件的餐廳</div></div>`;
  }

  document.getElementById('show-count').textContent = count;
  document.getElementById('total-count').textContent = allData.length + ' 家';
  document.getElementById('user-count-label').textContent = userCount > 0
    ? `👤 同仁新增 ${userCount} 家`
    : '⭐ 評分來源：Google Maps';
}

function calcWalkingTime(shopName, addr, lat, lng) {
  // 優先用傳入的座標，其次查本機清單
  let coords = null;
  if (lat && lng) {
    coords = { lat: parseFloat(lat), lng: parseFloat(lng) };
  } else {
    coords = SHOP_COORDS[shopName] || null;
  }
  if (!coords) return null;

  // Haversine 公式計算直線距離
  const R = 6371000; // 地球半徑（公尺）
  const dLat = (coords.lat - WEIHUA.lat) * Math.PI / 180;
  const dLng = (coords.lng - WEIHUA.lng) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(WEIHUA.lat * Math.PI/180) * Math.cos(coords.lat * Math.PI/180) *
            Math.sin(dLng/2)**2;
  const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  // 步行距離 = 直線距離 × 1.3（考慮街道轉彎）
  const walkDist = Math.round(dist * 1.3);
  // 步行時間（平均 80公尺/分鐘）
  const mins = Math.round(walkDist / 80);

  let emoji = '🚶';
  let color = 'var(--accent3)';
  if (mins <= 5) { emoji = '🏃'; color = 'var(--accent3)'; }
  else if (mins <= 10) { emoji = '🚶'; color = 'var(--accent2)'; }
  else if (mins <= 15) { emoji = '🚶'; color = 'var(--accent)'; }
  else { emoji = '🚶'; color = 'var(--tag-hot)'; }

  return { mins, dist: walkDist, emoji, color };
}
let currentReviewShop = '';
let currentReviewShopArea = '';
let currentReviewStar = 0;

async function loadReviews(shopName) {
  // 先顯示載入中
  const el = document.getElementById('d-reviews');
  if (!el) return;

  if (!APPS_SCRIPT_URL) {
    // 本地模式：用 localStorage
    renderReviewsLocal(shopName);
    return;
  }

  el.innerHTML = `<div style="font-size:12px;color:var(--text3);padding:12px 0;">載入評論中…</div>`;
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=reviews&shop=' + encodeURIComponent(shopName), { cache:'no-store' });
    const json = await res.json();
    if (json.ok) {
      renderReviewsFromData(shopName, json.data);
    } else {
      renderReviewsLocal(shopName);
    }
  } catch(e) {
    renderReviewsLocal(shopName);
  }
}

function renderReviewsFromData(name, reviews) {
  const el = document.getElementById('d-reviews');
  if (!el) return;
  const safeName = name.replace(/'/g,"\\'");
  let html = `<div class="section-title">💬 評論（${reviews.length}）</div>`;
  if (reviews.length === 0) {
    html += `<div style="font-size:12px;color:var(--text3);margin-bottom:12px;">還沒有評論，第一個來寫吧！</div>`;
  } else {
    html += reviews.map(rev=>`
      <div class="review-item">
        <div class="review-author">${rev.author||'匿名'}
          ${rev.star&&rev.star>0?`<span class="review-stars">${'★'.repeat(parseInt(rev.star))}${'☆'.repeat(5-parseInt(rev.star))}</span>`:''}
          <span style="color:var(--text3);font-weight:400;margin-left:6px;font-size:10px;">${rev.time||''}</span>
        </div>
        <div class="review-text">${rev.text}</div>
      </div>`).join('');
  }
  html += `<button class="add-review-btn" onclick="openReviewModal('${safeName}')">✏️ 新增評論</button>`;
  el.innerHTML = html;
}

function renderReviewsLocal(name) {
  // 備用：localStorage
  const el = document.getElementById('d-reviews');
  if (!el) return;
  const reviews = (() => { try { return JSON.parse(localStorage.getItem('rev_'+name)||'[]'); } catch(e){return[];} })();
  renderReviewsFromData(name, reviews);
}

async function submitReview() {
  const text = document.getElementById('r-text').value.trim();
  const author = document.getElementById('r-author').value.trim() || '匿名';
  const errEl = document.getElementById('r-error');
  if (!text) { errEl.textContent='請填入評論內容！'; errEl.style.display='block'; return; }
  errEl.style.display='none';

  const btn = document.querySelector('#review-modal .btn-submit');
  btn.disabled = true; btn.textContent = '送出中…';

  const entry = {
    action: 'addReview',
    shopName: currentReviewShop,
    author, text,
    star: currentReviewStar,
    time: new Date().toLocaleDateString('zh-TW')
  };

  if (!APPS_SCRIPT_URL) {
    // 本地模式
    const arr = (() => { try { return JSON.parse(localStorage.getItem('rev_'+currentReviewShop)||'[]'); } catch(e){return[];} })();
    arr.unshift(entry);
    localStorage.setItem('rev_'+currentReviewShop, JSON.stringify(arr));
    closeReviewModal();
    renderReviewsLocal(currentReviewShop);
    showToast('✓ 評論已新增！（本地模式）', 'success');
    btn.disabled=false; btn.textContent='✓ 送出評論';
    return;
  }

  try {
    const res = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify(entry) });
    const json = await res.json();
    if (json.ok) {
      closeReviewModal();
      await loadReviews(currentReviewShop);
      showToast('✓ 評論已同步給所有人！', 'success');
    } else { throw new Error(json.error); }
  } catch(err) {
    // 失敗改存本地
    const arr = (() => { try { return JSON.parse(localStorage.getItem('rev_'+currentReviewShop)||'[]'); } catch(e){return[];} })();
    arr.unshift(entry);
    localStorage.setItem('rev_'+currentReviewShop, JSON.stringify(arr));
    closeReviewModal();
    renderReviewsLocal(currentReviewShop);
    showToast('評論已儲存（同步失敗，僅本機）', 'error');
  } finally {
    btn.disabled=false; btn.textContent='✓ 送出評論';
  }
}

async function deleteEntry(e, idx) {
  e.stopPropagation();
  if (!confirm('確定要刪除這家店嗎？')) return;
  const r = allData[idx];

  if (!isApiMode) {
    const local = JSON.parse(localStorage.getItem('weihua_local')||'[]');
    const li = local.findIndex(u=>u.name===r.name&&u.area===r.area);
    if (li>=0) { local.splice(li,1); localStorage.setItem('weihua_local', JSON.stringify(local)); }
    await loadData();
    showToast('已刪除', 'success');
    return;
  }

  try {
    showToast('刪除中…', '');
    await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({ action:'delete', name: r.name, area: r.area })
    });
    await loadData();
    closeDetail();
    showToast('✓ 已刪除', 'success');
  } catch(err) {
    showToast('刪除失敗，請重試', 'error');
  }
}

// ── 自動取得座標（OpenStreetMap Nominatim）─────────────────
async function geocodeAddress(addr) {
  if (!addr) return null;
  try {
    const query = addr.includes('新竹') ? addr : addr + ' 新竹';
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
    const json = await res.json();
    if (json && json.length > 0) {
      return { lat: parseFloat(json[0].lat), lng: parseFloat(json[0].lon) };
    }
  } catch(e) { console.log('geocode failed', e); }
  return null;
}

async function submitForm() {
  const name = document.getElementById('f-name').value.trim();
  const cats = [...document.querySelectorAll('.cat-check:checked')].map(c=>c.value);
  const addr = document.getElementById('f-addr').value.trim();
  const errEl = document.getElementById('form-error');

  if (!name) { errEl.textContent='請填入店名！'; errEl.style.display='block'; return; }
  if (!cats.length) { errEl.textContent='請至少選一種類型！'; errEl.style.display='block'; return; }
  errEl.style.display='none';

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '新增中…';

  // 自動取得座標
  let lat = null, lng = null;
  if (addr) {
    btn.textContent = '取得位置中…';
    const coords = await geocodeAddress(addr);
    if (coords) { lat = coords.lat; lng = coords.lng; }
  }

  const entry = {
    name,
    area: document.getElementById('f-area').value,
    cat: cats,
    rating: document.getElementById('f-rating').value ? parseFloat(document.getElementById('f-rating').value) : null,
    addr,
    hours: document.getElementById('f-hours').value.trim(),
    closed: document.getElementById('f-closed').value.trim(),
    note: document.getElementById('f-note').value.trim(),
    lat, lng,
    user: true
  };

  // 新增到本機座標快取
  if (lat && lng) {
    SHOP_COORDS[name] = { lat, lng };
  }

  btn.textContent = '儲存中…';

  if (!isApiMode) {
    const local = JSON.parse(localStorage.getItem('weihua_local')||'[]');
    local.push(entry);
    localStorage.setItem('weihua_local', JSON.stringify(local));
    await loadData();
    closeModal();
    btn.disabled=false; btn.textContent='✓ 新增到地圖';
    showToast('✓ 已新增！（本地模式）', 'success');
    return;
  }

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify(entry)
    });
    const json = await res.json();
    if (json.ok) {
      await loadData();
      closeModal();
      showToast('✓ 新增成功！已同步給所有人', 'success');
    } else {
      throw new Error(json.error);
    }
  } catch(err) {
    showToast('新增失敗：' + err.message, 'error');
  } finally {
    btn.disabled=false; btn.textContent='✓ 新增到地圖';
  }
}
